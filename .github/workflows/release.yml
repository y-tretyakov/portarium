name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-tui:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p portarium-cli --release

      - name: Build TUI
        run: cargo build -p portarium-tui --release

      - name: Upload CLI + TUI binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/portarium-cli${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            target/release/portarium-tui${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Build Tauri desktop app
        run: npm run tauri build

      - name: Upload desktop packages
        shell: bash
        run: |
          shopt -s globstar nullglob
          bundles=(src-tauri/target/release/bundle/**/*.{deb,AppImage,dmg,msi,exe})
          if [ ${#bundles[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" "${bundles[@]}"
          else
            echo "No bundle artifacts found"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
