name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - platform: macos-latest
            target: aarch64-apple-darwin
            runner: macos-latest
          - platform: macos-13
            target: x86_64-apple-darwin
            runner: macos-13

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build
        run: npm ci && npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portarium-${{ matrix.target }}
          path: src-tauri/target/release/bundle/*

  create-release:
    needs: build-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: portarium-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            portarium-*/*
          generate_release_notes: true
